# Local forwarding information base configuration
spring.application.name=fib-routing-java

# Maximum number of route entries (across all prefixes and sources) kept in the FIB.
fib.max-routes=100000
# Deadline for a single lookup in nanoseconds (10 ms). A value <= 0 fails fast.
fib.lookup-timeout-nanos=10000000
# Optional family default next hops used when no explicit prefix matches.
# Leave empty so misses return UNREACHABLE instead.
fib.default-next-hop-ipv4=
fib.default-next-hop-ipv6=
# Durable state file for the single committed version (atomic rename + checksum).
fib.store-path=data/fib-state.json
fib.persistence-enabled=true

server.port=8080
