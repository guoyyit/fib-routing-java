# ===== 本地转发表（FIB）配置 =====
# 最大路由条数（按 前缀 x 管理距离 计数）；超限变更以 TABLE_FULL 拒绝
fib.max-routes=1000000
# 单次查找时间预算（纳秒）；超时抛 LOOKUP_TIMEOUT，不返回部分结果
fib.lookup-timeout-nanos=1000000000
# 未命中任何前缀时的可配置默认路由；关闭时返回 UNREACHABLE
fib.default-route-enabled=false
fib.default-route-next-hop-id=default-gw
fib.default-route-next-hop-address=192.0.2.1
# 已提交版本持久化文件（仅提交后的版本写盘；暂存更新不写盘）
fib.persistence-file=data/fib-committed.json
# 启动时是否从持久化文件恢复；文件损坏时拒绝加载并以空表启动
fib.restore-on-start=true

spring.jackson.default-property-inclusion=non_null
